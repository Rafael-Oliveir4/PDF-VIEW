<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizador de PDF</title>
    <style>
        body {
            text-align: center;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 0;
        }
        h1 {
            margin: 20px 0;
        }
        .container {
            width: 90%;
            max-width: 900px;
            margin: auto;
        }
        iframe {
            width: 100%;
            height: 80vh;
            border: none;
        }
    </style>
</head>
<body>
    <h1>Apresentação e Princípios da Empresa</h1>
    <div class="container">
        <iframe src="./src/PDF-teste.pdf"></iframe>
    </div>

    <script>
        // Bloquear clique com botão direito do mouse
        document.addEventListener("contextmenu", (event) => event.preventDefault());

        // Bloquear atalhos de teclado para evitar prints ou downloads
        document.addEventListener("keydown", function(event) {
            if (event.ctrlKey && (event.key === "s" || event.key === "p" || event.key === "u" || event.key === "c")) {
                event.preventDefault();
            }
        });
    </script>
</body>
</html>
